name: Deploy Stack to Portainer (Reusable)

# This workflow is a wrapper around deploy-terraform-stack.yml for backwards compatibility
# It now uses Terraform with the Portainer provider instead of direct API calls

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (development/production)'
        required: true
        type: string
      stack_name:
        description: 'Name of the Portainer stack'
        required: true
        type: string
      portainer_url:
        description: 'Portainer URL (via NetBird) - deprecated, use PORTAINER_URL variable instead'
        required: false
        type: string
        default: ''
      portainer_endpoint_id:
        description: 'Portainer endpoint ID - deprecated, use PORTAINER_ENDPOINT_ID variable instead'
        required: false
        type: string
        default: ''
      docker_host_ip:
        description: 'Docker host IP for SCP (NetBird internal) - deprecated, no longer used'
        required: false
        type: string
        default: ''
      ssh_user:
        description: 'SSH user on Docker host - deprecated, no longer used'
        required: false
        type: string
        default: 'deploy'
      git_branch:
        description: 'Git branch to deploy from'
        required: false
        type: string
        default: 'main'
      compose_file_path:
        description: 'Path to docker-compose.yml in repo'
        required: false
        type: string
        default: 'docker/docker-compose.yml'
    secrets:
      netbird_setup_key:
        description: 'NetBird setup key for tunnel'
        required: true
      portainer_token:
        description: 'Portainer API token'
        required: true
      gh_pat:
        description: 'GitHub PAT for Portainer Git authentication'
        required: true
      ssh_private_key:
        description: 'SSH private key - deprecated, no longer used'
        required: false
      cloudflare_tunnel_token:
        description: 'Cloudflare Tunnel token'
        required: true
      db_password:
        description: 'PostgreSQL password'
        required: true
      redis_password:
        description: 'Redis password'
        required: true

jobs:
  deploy:
    uses: ./.github/workflows/deploy-terraform-stack.yml
    with:
      environment: ${{ inputs.environment }}
      stack_name: ${{ inputs.stack_name }}
      compose_file_path: ${{ inputs.compose_file_path }}
      git_branch: ${{ inputs.git_branch }}
    secrets:
      portainer_token: ${{ secrets.portainer_token }}
      gh_pat: ${{ secrets.gh_pat }}
      cloudflare_tunnel_token: ${{ secrets.cloudflare_tunnel_token }}
      db_password: ${{ secrets.db_password }}
      redis_password: ${{ secrets.redis_password }}
      netbird_setup_key: ${{ secrets.netbird_setup_key }}
